<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Адаптивный шаблон Bootstrap 4</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
    
    <style>
        
        .box {
            background-color: #2e5c9a; 
            margin-bottom: 15px; 
            border-radius: 0;
        }


        .header-box, .footer-box {
            height: 120px;
        }

       
        .grid-box {
            height: 150px; 
        }

        
        .grid-box-large {
            height: 250px; 
        }

    
        .dots-divider {
            text-align: center;
            font-size: 32px;
            font-weight: bold;
            color: #000;
            line-height: 1;
            margin: 10px 0 20px 0;
            letter-spacing: 5px;
        }
    </style>
</head>
<body>

    <div class="container-fluid mt-4">
        

        <div class="row">
            <div class="col-12">
                <div class="box header-box"></div>
            </div>
        </div>


        <div class="row d-none d-xl-flex">

            <div class="col-xl-3"><div class="box grid-box"></div></div>
            <div class="col-xl-3"><div class="box grid-box"></div></div>
            <div class="col-xl-3"><div class="box grid-box"></div></div>
            <div class="col-xl-3"><div class="box grid-box"></div></div>
            

            <div class="col-xl-3"><div class="box grid-box"></div></div>
            <div class="col-xl-3"><div class="box grid-box"></div></div>
            <div class="col-xl-3"><div class="box grid-box"></div></div>
            <div class="col-xl-3"><div class="box grid-box"></div></div>
        </div>


        <div class="d-xl-none">
            

            <div class="row">
                <div class="col-12 col-lg-6">
                    <div class="box grid-box-large"></div>
                </div>
                <div class="col-12 col-lg-6">
                    <div class="box grid-box-large"></div>
                </div>
            </div>
            
            <div class="row">
                <div class="col-12 col-lg-6">
                    <div class="box grid-box-large"></div>
                </div>
                <div class="col-12 col-lg-6">
                    <div class="box grid-box-large"></div>
                </div>
            </div>

            <div class="row">
                <div class="col-12">
                    <div class="dots-divider">. . .</div>
                </div>
            </div>

        </div>

        <div class="row">
            <div class="col-12">
                <div class="box footer-box"></div>
            </div>
        </div>

    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
